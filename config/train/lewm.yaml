defaults:
  - _self_
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 192
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wandb:
  enabled: True
  config:
    entity: adamsc
    project: lewm
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  embed_dim: 192

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    # type: gaussian   → standard SIGReg (default)
    # type: t_dist     → t-distribution SIGReg (heavy-tail target)
    type: t_dist
    kwargs:
      knots: 17
      num_proj: 1024
      # --- gaussian-only params (ignored when type=t_dist) ---
      dim: 192      # must match wm.embed_dim
      rho: 0.5      # 0.0 = original isotropic; try 0.3/0.5 for adaptive diagonal
      beta_sigma: 1e-3
      # --- t_dist-only params (ignored when type=gaussian) ---
      nu: 3.0       # degrees of freedom: 3 (heavy) → 5 → 10 → 30+ (≈ gaussian)
      t_max: 4.0    # upper limit of integration interval (t-dist CF decays slower)

  # Route 1: effective rank maximisation (no learnable params; composable with any SIGReg)
  rank_reg:
    enabled: false
    weight: 0.01
    min_var_threshold: 0.01

  # Route 2: soft-whitening SIGReg (replaces SIGReg; set sigreg.kwargs.rho to 0)
  soft_whiten:
    enabled: false

  # Route 3: learnable spectral shape (composable with SIGReg rho=0)
  spectral_reg:
    enabled: false
    weight: 0.01
    kwargs:
      dim: 192      # must match wm.embed_dim
      init_decay: 0.02
      max_decay: 5.0
      decay_penalty: 0.01
